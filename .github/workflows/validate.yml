name: Validate site

# The public site is validated on every change: no un-negated overclaims, no broken links / missing assets,
# valid HTML (blocking). The reserved-terminology boundary is enforced from the private side before
# publishing (a public denylist would itself leak the terms), so it is intentionally not run here.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: claim + links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # NOTE: the reserved-terminology denylist is deliberately NOT carried in this public repo —
      # a public denylist would itself publish the reserved terms. That boundary is enforced before
      # publishing from the private side (the product repo's check_reserved_terms.py / pre-publish scan).
      - name: Claim-discipline scan (no un-negated certify/guarantee/prove-safety/human-validated)
        run: python scripts/check_claim_discipline.py .
      - name: Broken links + missing assets
        run: python scripts/check_links.py
      - name: Release provenance (audit ids / classifier / version vs pinned manifest)
        run: python scripts/check_release_provenance.py
      - name: Site contract (routes, redirects, maturity labels, governance wording)
        run: python scripts/check_site_contract.py .
      - name: Site-contract mutation suite (the contract must fail when broken)
        run: python scripts/test_site_contract_mutations.py .

  html:
    name: HTML validation (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install html5validator==0.4.2
      - name: validate HTML (blocking)
        run: html5validator --root . --blacklist scripts
